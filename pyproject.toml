[project]
name = "mini-torrent"
version = "0.1.0"
description = "mt - компактный CLI-клиент торрентов: тонкий клиент, фоновый демон, TUI"
readme = "README.md"
authors = [
    { name = "ai-prosto", email = "ai@pr0sto.xyz" }
]
requires-python = ">=3.12"
dependencies = [
    "libtorrent>=2.1.1",
]

[project.scripts]
mt = "mt.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mt"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
